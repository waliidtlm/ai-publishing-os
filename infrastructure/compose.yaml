name: ai-publishing-os

services:
  database:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-publishing_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-database-only-2026}
      POSTGRES_USER: ${POSTGRES_USER:-publishing_os}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-publishing_os} -d ${POSTGRES_DB:-publishing_os}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  dashboard:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-compose-development-secret-change-before-sharing}
      DATABASE_URL: postgresql://${POSTGRES_USER:-publishing_os}:${POSTGRES_PASSWORD:-local-database-only-2026}@database:5432/${POSTGRES_DB:-publishing_os}?schema=public
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-publishing_os}:${POSTGRES_PASSWORD:-local-database-only-2026}@database:5432/publishing_os_test?schema=public
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-compose-internal-api-key-change-before-sharing}
      INTERNAL_API_RATE_LIMIT_MAX: ${INTERNAL_API_RATE_LIMIT_MAX:-60}
      INTERNAL_API_RATE_LIMIT_WINDOW_SECONDS: ${INTERNAL_API_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RSS_MAX_SOURCES_PER_RUN: ${RSS_MAX_SOURCES_PER_RUN:-25}
      RSS_MAX_ENTRIES_PER_SOURCE: ${RSS_MAX_ENTRIES_PER_SOURCE:-20}
      RSS_REQUEST_TIMEOUT_MS: ${RSS_REQUEST_TIMEOUT_MS:-10000}
      RSS_MAX_RESPONSE_BYTES: ${RSS_MAX_RESPONSE_BYTES:-1048576}
      RSS_MAX_REDIRECTS: ${RSS_MAX_REDIRECTS:-3}
      RESEARCH_DEFAULT_MODE: ${RESEARCH_DEFAULT_MODE:-deterministic}
      RESEARCH_AI_ENABLED: ${RESEARCH_AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL_RESEARCH: ${AI_MODEL_RESEARCH:-gpt-5-mini}
      AI_API_KEY: ${AI_API_KEY:-}
      RESEARCH_ALLOW_DETERMINISTIC_FALLBACK: ${RESEARCH_ALLOW_DETERMINISTIC_FALLBACK:-false}
      RESEARCH_MAX_SOURCES_PER_JOB: ${RESEARCH_MAX_SOURCES_PER_JOB:-10}
      RESEARCH_MAX_NOTES_PER_JOB: ${RESEARCH_MAX_NOTES_PER_JOB:-5}
      RESEARCH_REQUEST_TIMEOUT_MS: ${RESEARCH_REQUEST_TIMEOUT_MS:-15000}
      RESEARCH_MAX_RESPONSE_BYTES: ${RESEARCH_MAX_RESPONSE_BYTES:-2097152}
      RESEARCH_MAX_REDIRECTS: ${RESEARCH_MAX_REDIRECTS:-3}
      RESEARCH_MAX_INPUT_CHARS: ${RESEARCH_MAX_INPUT_CHARS:-100000}
      RESEARCH_MAX_OUTPUT_TOKENS: ${RESEARCH_MAX_OUTPUT_TOKENS:-2500}
      RESEARCH_MAX_CLAIMS_PER_SOURCE: ${RESEARCH_MAX_CLAIMS_PER_SOURCE:-10}
      RESEARCH_MAX_EXCERPT_CHARS: ${RESEARCH_MAX_EXCERPT_CHARS:-500}
      RESEARCH_MAX_CONCURRENT_FETCHES: ${RESEARCH_MAX_CONCURRENT_FETCHES:-2}
      RESEARCH_MAX_CONCURRENT_AI_PER_SITE: ${RESEARCH_MAX_CONCURRENT_AI_PER_SITE:-1}
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-developer@example.com}
      DEV_AUTH_PASSWORD: ${DEV_AUTH_PASSWORD:-local-development-only-2026}
      DEV_AUTH_NAME: ${DEV_AUTH_NAME:-Local Developer}
    command:
      [
        "sh",
        "-c",
        "pnpm db:migrate:deploy && pnpm --filter @ai-publishing-os/dashboard dev --hostname 0.0.0.0",
      ]
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
